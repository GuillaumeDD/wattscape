<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://odre.opendatasoft.com https://api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Wattscape</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="scene">
    <canvas id="scene" role="img"></canvas>
    <main>
      <div id="panel-head">
        <h1 id="title"></h1>
        <button id="panel-toggle" type="button" aria-controls="panel-body"></button>
      </div>
      <div id="panel-body">
        <p id="tagline"></p>
        <p id="status"></p>
        <div id="area-picker">
          <label for="area" id="area-label"></label>
          <select id="area"></select>
          <button id="locate" type="button"></button>
        </div>
        <p id="location-note"></p>
        <button id="language" type="button"></button>
      </div>
      <!-- Outside the folding part: where the figures come from stays on screen. -->
      <p id="plants-note" role="status"></p>
    </main>
    <footer id="credits">
      <span id="credits-data"></span>
      <a href="https://odre.opendatasoft.com/explore/dataset/eco2mix-regional-tr/" rel="noreferrer"
        >RTE éCO2mix</a
      >
      <span id="credits-eco2mix-licence"></span>
      <a href="https://open-meteo.com/" rel="noreferrer">Open-Meteo.com</a>
      <span id="credits-weather-licence"></span>
      <span id="credits-map"></span>
      <a href="https://geoservices.ign.fr/" rel="noreferrer">IGN</a>
      <span id="credits-map-licence"></span>
      <a href="https://www.naturalearthdata.com/" rel="noreferrer">Natural Earth</a>
      <span id="credits-plants"></span>
      <a
        href="https://odre.opendatasoft.com/explore/dataset/registre-national-installation-production-stockage-electricite-agrege-311224/"
        rel="noreferrer"
        >ODRÉ</a
      >
      <span id="credits-plants-licence"></span>
      · <a id="debug-link" href="./debug.html"></a>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
