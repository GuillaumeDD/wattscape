<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://odre.opendatasoft.com https://api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Wattscape</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="scene">
    <canvas id="scene" role="img"></canvas>
    <div id="caption" role="status" hidden>
      <strong id="caption-name"></strong>
      <span id="caption-line"></span>
    </div>
    <main>
      <div id="panel-head">
        <h1 id="title"></h1>
        <button id="panel-toggle" type="button" aria-controls="panel-body"></button>
      </div>
      <div id="panel-body">
        <p id="tagline"></p>
        <p id="status"></p>
        <div id="area-picker">
          <label for="area" id="area-label"></label>
          <select id="area"></select>
          <button id="locate" type="button"></button>
        </div>
        <p id="location-note"></p>
        <div id="theme-picker">
          <label for="theme" id="theme-label"></label>
          <select id="theme"></select>
        </div>
        <button id="language" type="button"></button>
      </div>
      <!-- Outside the folding part: where the figures come from stays on screen. -->
      <p id="plants-note" role="status"></p>
      <p id="weather-note" role="status"></p>
      <p id="season-note" role="status" hidden></p>
    </main>
    <footer id="credits">
      <!-- The survey mode's controls (B-032): discreet, they fade away while it plays;
           just above the credits, whatever their height. -->
      <div id="survey">
        <span id="survey-area" role="status"></span>
        <button id="survey-play" type="button">
          <svg class="icon-play" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2.5 1.5 L8.5 5 L2.5 8.5 Z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2 1.5 H4 V8.5 H2 Z M6 1.5 H8 V8.5 H6 Z" />
          </svg>
        </button>
        <button id="survey-stop" type="button" hidden>
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2 H8 V8 H2 Z" /></svg>
        </button>
        <button id="home" type="button">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M5 1 L9.5 5 H8 V9 H6 V6.5 H4 V9 H2 V5 H0.5 Z" />
          </svg>
        </button>
        <button id="screensaver" type="button">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path
              d="M1 1 H4 V2 H2 V4 H1 Z M6 1 H9 V4 H8 V2 H6 Z M1 6 H2 V8 H4 V9 H1 Z M8 6 H9 V9 H6 V8 H8 Z"
            />
          </svg>
        </button>
      </div>
      <span id="credits-data"></span>
      <a href="https://odre.opendatasoft.com/explore/dataset/eco2mix-regional-tr/" rel="noreferrer"
        >RTE éCO2mix</a
      >
      <span id="credits-eco2mix-licence"></span>
      <a href="https://open-meteo.com/" rel="noreferrer">Open-Meteo.com</a>
      <span id="credits-weather-licence"></span>
      <span id="credits-map"></span>
      <a href="https://geoservices.ign.fr/" rel="noreferrer">IGN</a>
      <span id="credits-map-licence"></span>
      <a href="https://www.naturalearthdata.com/" rel="noreferrer">Natural Earth</a>
      <span id="credits-plants"></span>
      <a
        href="https://odre.opendatasoft.com/explore/dataset/registre-national-installation-production-stockage-electricite-agrege-311224/"
        rel="noreferrer"
        >ODRÉ</a
      >
      <span id="credits-plants-licence"></span>
      · <a id="debug-link" href="./debug.html"></a>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
